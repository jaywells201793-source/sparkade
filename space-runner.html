<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameNest — Space Runner</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  min-height: 100vh;

  background: #08111f;

  color: white;

  font-family: Arial, sans-serif;

  display: flex;

  justify-content: center;

  align-items: center;

}

.game-wrapper {

  width: min(900px, 96vw);

  text-align: center;

}

h1 {

  margin: 0 0 5px;

  font-size: 32px;

}

.subtitle {

  color: #9fb3c8;

  margin-bottom: 15px;

}

.hud {

  display: flex;

  justify-content: space-between;

  background: #111d31;

  padding: 12px 18px;

  border-radius: 12px 12px 0 0;

  font-weight: bold;

}

canvas {

  width: 100%;

  max-width: 900px;

  display: block;

  background: #02060d;

  border: 2px solid #263c5b;

  touch-action: none;

}

.controls {

  display: flex;

  justify-content: center;

  gap: 15px;

  margin-top: 15px;

}

<a class="button" href="space-runner.html">

  Play Free

</a>

  border: 0;

  border-radius: 12px;

  padding: 14px 24px;

  background: #5b8cff;

  color: white;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}

button:hover {

  background: #4779e8;

}

#restart {

  display: none;

  margin: 15px auto 0;

}

.instructions {

  color: #91a3b8;

  font-size: 14px;

  margin-top: 12px;

}

</style>

</head>

<body>

<div class="game-wrapper">

  <h1>🚀 Space Runner</h1>

  <div class="subtitle">

    A GameNest original

  </div>

  <div class="hud">

    <div>Score: <span id="score">0</span></div>

    <div>Lives: <span id="lives">3</span></div>

    <div>Stars: <span id="stars">0</span></div>

  </div>

  <canvas id="game" width="900" height="500"></canvas>

  <div class="controls">

    <button id="left">⬅ Left</button>

    <button id="right">Right ➡</button>

  </div>

  <button id="restart">🔄 Play Again</button>

  <div class="instructions">

    Use the arrow keys or buttons to move. Avoid asteroids and collect stars!

  </div>

</div>

<script>

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");

const livesText = document.getElementById("lives");

const starsText = document.getElementById("stars");

const restartButton = document.getElementById("restart");

let keys = {};

let gameRunning = true;

let score = 0;

let lives = 3;

let starsCollected = 0;

let player = {

  x: canvas.width / 2,

  y: canvas.height - 70,

  width: 42,

  height: 50,

  speed: 7

};

let asteroids = [];

let stars = [];

let particles = [];

let asteroidTimer = 0;

let starTimer = 0;

let difficulty = 1;

/* -----------------------------

   KEYBOARD CONTROLS

----------------------------- */

document.addEventListener("keydown", function(e) {

  keys[e.key] = true;

});

document.addEventListener("keyup", function(e) {

  keys[e.key] = false;

});

/* -----------------------------

   MOBILE / BUTTON CONTROLS

----------------------------- */

function holdButton(button, direction) {

  button.addEventListener("pointerdown", () => {

    keys[direction] = true;

  });

  button.addEventListener("pointerup", () => {

    keys[direction] = false;

  });

  button.addEventListener("pointerleave", () => {

    keys[direction] = false;

  });

}

holdButton(document.getElementById("left"), "ArrowLeft");

holdButton(document.getElementById("right"), "ArrowRight");

/* -----------------------------

   DRAW PLAYER

----------------------------- */

function drawPlayer() {

  ctx.save();

  ctx.translate(player.x, player.y);

  // spaceship

  ctx.fillStyle = "#5b8cff";

  ctx.beginPath();

  ctx.moveTo(0, -25);

  ctx.lineTo(-21, 22);

  ctx.lineTo(0, 13);

  ctx.lineTo(21, 22);

  ctx.closePath();

  ctx.fill();

  // window

  ctx.fillStyle = "#bfe7ff";

  ctx.beginPath();

  ctx.arc(0, -5, 7, 0, Math.PI * 2);

  ctx.fill();

  // engine

  ctx.fillStyle = "#ffb84d";

  ctx.beginPath();

  ctx.moveTo(-8, 18);

  ctx.lineTo(0, 34 + Math.random() * 8);

  ctx.lineTo(8, 18);

  ctx.closePath();

  ctx.fill();

  ctx.restore();

}

/* -----------------------------

   ASTEROIDS

----------------------------- */

function createAsteroid() {

  asteroids.push({

    x: Math.random() * (canvas.width - 40) + 20,

    y: -40,

    size: 18 + Math.random() * 22,

    speed: 3 + Math.random() * 3 + difficulty

  });

}

function drawAsteroid(a) {

  ctx.fillStyle = "#777";

  ctx.beginPath();

  ctx.arc(a.x, a.y, a.size, 0, Math.PI * 2);

  ctx.fill();

  ctx.fillStyle = "#555";

  ctx.beginPath();

  ctx.arc(

    a.x - a.size / 3,

    a.y - a.size / 4,

    a.size / 5,

    0,

    Math.PI * 2

  );

  ctx.fill();

}

/* -----------------------------

   STARS

----------------------------- */

function createStar() {

  stars.push({

    x: Math.random() * (canvas.width - 40) + 20,

    y: -30,

    size: 10,

    speed: 3 + difficulty

  });

}

function drawStar(s) {

  ctx.fillStyle = "#ffe66d";

  ctx.beginPath();

  for (let i = 0; i < 10; i++) {

    let angle = Math.PI / 2 + i * Math.PI / 5;

    let radius = i % 2 === 0 ? s.size : s.size / 2;

    let x = s.x + Math.cos(angle) * radius;

    let y = s.y + Math.sin(angle) * radius;

    if (i === 0) {

      ctx.moveTo(x, y);

    } else {

      ctx.lineTo(x, y);

    }

  }

  ctx.closePath();

  ctx.fill();

}

/* -----------------------------

   COLLISION

----------------------------- */

function collision(a, b) {

  return (

    Math.abs(a.x - b.x) <

    (a.width || a.size) / 2 + (b.width || b.size) / 2

    &&

    Math.abs(a.y - b.y) <

    (a.height || a.size) / 2 + (b.height || b.size) / 2

  );

}

/* -----------------------------

   PARTICLES

----------------------------- */

function explosion(x, y) {

  for (let i = 0; i < 20; i++) {

    particles.push({

      x: x,

      y: y,

      vx: (Math.random() - .5) * 7,

      vy: (Math.random() - .5) * 7,

      life: 40

    });

  }

}

function drawParticles() {

  particles.forEach(p => {

    ctx.fillStyle = "#ffb84d";

    ctx.fillRect(p.x, p.y, 4, 4);

    p.x += p.vx;

    p.y += p.vy;

    p.life--;

  });

  particles = particles.filter(p => p.life > 0);

}

/* -----------------------------

   GAME OVER

----------------------------- */

function gameOver() {

  gameRunning = false;

  ctx.fillStyle = "rgba(0,0,0,.75)";

  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";

  ctx.textAlign = "center";

  ctx.font = "bold 48px Arial";

  ctx.fillText("GAME OVER", canvas.width / 2, 210);

  ctx.font = "24px Arial";

  ctx.fillText(

    "Final Score: " + score,

    canvas.width / 2,

    255

  );

  ctx.font = "18px Arial";

  ctx.fillText(

    "Can you beat your score?",

    canvas.width / 2,

    295

  );

  restartButton.style.display = "block";

}

/* -----------------------------

   RESET GAME

----------------------------- */

function resetGame() {

  score = 0;

  lives = 3;

  starsCollected = 0;

  asteroids = [];

  stars = [];

  particles = [];

  player.x = canvas.width / 2;

  difficulty = 1;

  gameRunning = true;

  restartButton.style.display = "none";

  updateHUD();

}

/* -----------------------------

   HUD

----------------------------- */

function updateHUD() {

  scoreText.textContent = score;

  livesText.textContent = lives;

  starsText.textContent = starsCollected;

}

/* -----------------------------

   GAME UPDATE

----------------------------- */

function update() {

  if (!gameRunning) return;

  /* Player movement */

  if (keys["ArrowLeft"]) {

    player.x -= player.speed;

  }

  if (keys["ArrowRight"]) {

    player.x += player.speed;

  }

  player.x = Math.max(

    25,

    Math.min(canvas.width - 25, player.x)

  );

  /* Create asteroids */

  asteroidTimer++;

  if (asteroidTimer > Math.max(18, 45 - difficulty * 3)) {

    createAsteroid();

    asteroidTimer = 0;

  }

  /* Create stars */

  starTimer++;

  if (starTimer > 70) {

    createStar();

    starTimer = 0;

  }

  /* Move asteroids */

  asteroids.forEach(a => {

    a.y += a.speed;

    if (collision(player, a)) {

      explosion(player.x, player.y);

      lives--;

      a.y = canvas.height + 100;

      updateHUD();

      if (lives <= 0) {

        gameOver();

      }

    }

  });

  /* Move stars */

  stars.forEach(s => {

    s.y += s.speed;

    if (collision(player, s)) {

      starsCollected++;

      score += 25;

      s.y = canvas.height + 100;

      updateHUD();

    }

  });

  /* Remove objects */

  asteroids = asteroids.filter(a => a.y < canvas.height + 80);

  stars = stars.filter(s => s.y < canvas.height + 50);

  /* Increase score */

  score++;

  difficulty += 0.0005;

  updateHUD();

}

/* -----------------------------

   DRAW

----------------------------- */

function drawBackground() {

  ctx.fillStyle = "#02060d";

  ctx.fillRect(

    0,

    0,

    canvas.width,

    canvas.height

  );

  // stars in background

  ctx.fillStyle = "#ffffff";

  for (let i = 0; i < 80; i++) {

    let x = (i * 113) % canvas.width;

    let y = (i * 67 + score * 0.3) % canvas.height;

    ctx.fillRect(x, y, 2, 2);

  }

}

function draw() {

  drawBackground();

  asteroids.forEach(drawAsteroid);

  stars.forEach(drawStar);

  drawPlayer();

  drawParticles();

}

/* -----------------------------

   MAIN LOOP

----------------------------- */

function gameLoop() {

  update();

  draw();

  requestAnimationFrame(gameLoop);

}

/* -----------------------------

   RESTART

----------------------------- */

restartButton.addEventListener("click", resetGame);

/* START GAME */

updateHUD();

gameLoop();

</script>

</body>

</html>
